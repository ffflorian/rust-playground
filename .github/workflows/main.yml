name: Test all projects

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Test all projects
        run: ./bin/test-all.sh
